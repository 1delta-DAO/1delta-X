syntax = "proto3";
package onedelta.orderbook.v1;

message LegIn {
  bytes token = 1;
  bytes start = 2;
  bytes end   = 3;
}

message LegOut {
  bytes token     = 1;
  bytes start     = 2;
  bytes end       = 3;
  bytes recipient = 4;
}

message CurvePoint {
  uint32 timeDelta = 1;
  uint32 bumpBps   = 2;
}

message Item {
  uint32 op        = 1;
  bytes  module    = 2;
  bytes  amount    = 3;
  bytes  recipient = 4;
  bytes  data      = 5;
}

message Validator {
  bytes target = 1;
  bytes data   = 2;
}

message Order {
  bytes     maker                  = 1;
  uint32    side                   = 2;
  bytes     nonce                  = 3;
  bytes     deadline               = 4;
  repeated  LegIn legsIn           = 5;
  repeated  LegOut legsOut         = 6;
  bytes     timing                 = 7;
  bytes     exclusiveFiller        = 8;
  bytes     minFillAnchor          = 9;
  bytes     exclusivityOverrideBps = 10;
  repeated  CurvePoint curve       = 11;
  bytes     gasBumpBps             = 12;
  bytes     gasPriceRef            = 13;
  repeated  Item items             = 14;
  repeated  Validator validators   = 15;
  repeated  Validator invariants   = 16;
  bytes     fillModule             = 17;
  bytes     fillTotal              = 18;
  bytes     priorityScale          = 19;
  bytes     pricingModule          = 20;
  bytes     baselinePriorityFeeWei = 21;
}

message TokenPermit {
  bytes  spender    = 1;
  bytes  token      = 2;
  bytes  amount     = 3;
  uint64 expiration = 4;
}

message TakerPermit {
  bytes  spender    = 1;
  bytes  module     = 2;
  bytes  ref        = 3;
  bytes  amount     = 4;
  uint64 expiration = 5;
}

message PermitBatch {
  repeated TokenPermit tokens = 1;
  repeated TakerPermit takers = 2;
  bytes    nonce              = 3;
  bytes    deadline           = 4;
}

// A signed order in flight. The self-authenticating unit: (order, sig) verifies
// against the Settlement domain with zero trust in the relay. Optional
// permitBatch carries the single-signature fillWithPermit allowances; sigless
// marks the on-chain approveOrder path (maker cannot ECDSA-sign).
message OrderAnnounce {
  Order       order       = 1;
  bytes       sig         = 2;
  PermitBatch permitBatch = 3;
  bool        sigless     = 4;
}

// Maker-signed soft cancel — the free, off-chain retraction.
//
// sig is EIP-712 over SoftCancel(address maker,bytes32[] orderHashes,
// uint256 issuedAt,uint256 expiry) in the SETTLEMENT domain, so it is bound to
// one chain + settlement and verifies under the same signer set an order does
// (EOA, EIP-1271 contract maker, maker-nominated delegate). A node evicts only
// hashes whose order names THIS maker, so a valid signature over someone else's
// order hash retracts nothing.
//
// ADVISORY: evicts from books, does not bind a filler already holding the order.
// The on-chain cancels stay ground truth. Spec: docs/soft-cancel.md.
message SoftCancel {
  bytes    maker       = 1;
  repeated bytes orderHashes = 2;
  bytes    issuedAt    = 3;
  bytes    expiry      = 4;
  bytes    sig         = 5;
}

// Cancel-and-replace in one message: retract the named order and admit the
// replacement atomically. Both halves are independently signed; a node that
// cannot verify either half applies NEITHER.
message OrderReplace {
  SoftCancel    cancel   = 1;
  OrderAnnounce announce = 2;
  bytes         replaces = 3;
}

// Advisory "I'm taking this" hint to cut wasted races. filled[orderHash]
// on-chain stays authoritative.
message FillNotice {
  bytes orderHash = 1;
  bytes filler    = 2;
}

message OrderList {
  repeated OrderAnnounce orders = 1;
}

// WebSocket stream envelope from a centralized backend to a thin client.
// SNAPSHOT (orders) on connect, then live ADD / CANCEL / REPLACE.
message StreamMessage {
  uint32        kind    = 1; // 0 SNAPSHOT, 1 ADD, 2 CANCEL, 3 REPLACE
  repeated      OrderAnnounce orders = 2;
  OrderAnnounce order   = 3;
  SoftCancel    cancel  = 4;
  OrderReplace  replace = 5;
}
