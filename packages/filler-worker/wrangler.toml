# Cloudflare Worker + Durable Object running the Rootstock beta filler (chain 30).
# Deploy runbook: README.md. Vars below are defaults; addresses marked PLACEHOLDER
# must be replaced once the contracts are deployed (until then every tick only
# records "not configured" and sends nothing).
#
# Secrets (never in this file): `wrangler secret put <NAME>`
#   PRIVATE_KEY        the hot wallet / operator EOA (0x + 64 hex)
#   ADMIN_TOKEN        bearer token for every admin route (openssl rand -hex 32)
#   ALERT_WEBHOOK_URL  Slack incoming-webhook URL, or Telegram's
#                      https://api.telegram.org/bot<token>/sendMessage (see ALERT_FORMAT)
#   RPC_URL_SECRET     recommended: a keyed Rootstock RPC, read in preference to the
#                      RPC_URL var below (so the var line can stay — a var and a
#                      secret cannot share a name)
#   ORDERBOOK_BINDING_KEY  optional: the orderbook's BINDING_KEY, so its rate limiter
#                      bills the filler its own bucket instead of "unknown"
#   QUOTE_BINDING_KEY  recommended: shared with the app's Pages worker (its
#                      FILLER_BINDING_KEY) so `POST /quote` is rate-limited per VISITOR
#                      (x-filler-client-ip); without it every app visitor shares one bucket

name = "filler-1delta-rsk"
main = "src/index.ts"
compatibility_date = "2025-09-01"
# The admin routes refuse *.workers.dev hosts unless ADMIN_ALLOW_WORKERS_DEV = "true"
# (only /health answers there). PRODUCTION: serve the admin API on a custom domain
# BEHIND CLOUDFLARE ACCESS (a second factor in front of ADMIN_TOKEN, which can take
# the filler live), then set workers_dev = false:
#   routes = [{ pattern = "filler.example.com", custom_domain = true }]
# Never set ADMIN_ALLOW_WORKERS_DEV = "true" in production.
workers_dev = true
# No per-version preview URLs (<version>-<name>.<account>.workers.dev): each would be
# one more public hostname for this worker (and its admin routes, if ever allowed on
# workers.dev).
preview_urls = false

[[durable_objects.bindings]]
name = "FILLER"
class_name = "FillerDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["FillerDO"]

# Order intake: a service binding to the orderbook worker (no public hop, no
# per-IP rate limit shared with visitors). ORDERBOOK_URL is the fallback when the
# binding is absent.
[[services]]
binding = "ORDERBOOK"
service = "orderbook-1delta-rsk"

# The cron only re-arms the Durable Object's self-rescheduling alarm.
[triggers]
crons = ["* * * * *"]

[observability]
enabled = true

[vars]
# ── safety ───────────────────────────────────────────────────────────────────
# Dry run is ON by default: nothing is broadcast until DRY_RUN = "0" here or
# `POST /dry-run {"on": false}` on the admin API.
DRY_RUN = "0"
# Start paused? ("true" = no sends until `POST /resume`). Pending txs are still resolved.
START_PAUSED = "false"
# Keep "false" in production (see workers_dev above).
ADMIN_ALLOW_WORKERS_DEV = "false"

# ── chain / deployment ──────────────────────────────────────────────────────
CHAIN_ID = "30"
# Fallback only: set the RPC_URL_SECRET secret to a keyed provider (the public node
# rate-limits — a 45 s HTTP 429 brownout is a tested failure mode — and the filler
# makes tens of thousands of calls a day).
RPC_URL = "https://rpc-gateway.1delta.io/30"
# Primary: the RPC_URL_SECRET secret (dRPC, set 2026-10-14) when present, else RPC_URL.
# Tried in order when the primary errors or times out (2026-10-12: public-node.rsk.co
# and mycrypto.rsk.co went dark — every quote waited 10–30 s and came back 422). A short
# per-request timeout so a dead endpoint costs seconds, not the whole quote.
# (+ the secret RPC_FALLBACK_URLS_SECRET, tried first: a keyed provider, never committed)
RPC_FALLBACK_URLS = "https://rpc-gateway.1delta.io/30,https://public-node.rsk.co,https://mycrypto.rsk.co"
RPC_TIMEOUT_MS = "6000"
# Concurrent eth_call reads merge into one Multicall3 call (balances, allowances, lens
# reads); simulations / previews with a sender are never merged.
RPC_MULTICALL = "1"
# The send gas price is re-read once per ~block (Rootstock's minimum moves ≤ 1 % a block).
GAS_PRICE_TTL_MS = "30000"
SETTLEMENT = "0xe6EDbb5c49Fb4CFb313476e3B78E274D3584ddf5"   # Rootstock beta 2026-10-09 (b23ec90)
PERMIT3 = "0xabaefb5ae495Dcbce40d1e057346f31A500668a8"
LENS = "0xF9e905EdCC376FDaBF62Ca0966624611721C5206"
# The deployed AggregatorFillSolver (route strategy). Empty = route strategy off.
AGGREGATOR_SOLVER = "0x48dbdC43507767BD51ec0AF2cb9bfa5E35B332F1"
ORDERBOOK_URL = ""
ORDERBOOK_CLIENT_IP = "127.0.0.2"
# Optional Durable Object location hint, e.g. "wnam" (near the public Rootstock RPCs).
# Only affects where the object is first CREATED; an existing object never moves.
DO_LOCATION_HINT = ""

# ── strategies (see packages/beta-filler/README.md for every knob) ──────────
INVENTORY_ENABLED = "1"
# ROUTE_ENABLED defaults to on iff AGGREGATOR_SOLVER is set.
# Retain mode: the spread stays on the solver (== AGGREGATOR_SOLVER), skipping the
# per-fill payout transfer (−5.2k gas direct, −6.2k pull). Operators batch-recover it
# with AggregatorFillSolver.sweep(token, to, amount).
ROUTE_PROFIT_RECIPIENT = "0x48dbdC43507767BD51ec0AF2cb9bfa5E35B332F1"
ROUTE_SLIPPAGE_BPS = "10"
ROUTE_STABLE_SLIPPAGE_BPS = "5"
# v2 solver (2026-10-12): a pool plan assumes this − 30k = 265k (fork: 229k net direct).
ROUTE_GAS_ESTIMATE = "295000"
MAX_ROUTE_GAS = "1200000"
ROUTE_HOURLY_FILLS = "60"
MIN_PROFIT_RBTC = "0"
# Local pool plans (Oku = venue 0, SushiSwap v3 = venue 1; the solver swaps on the pools
# itself, no sandbox): QUOTER_V2 and SUSHI_V3_QUOTER default to Rootstock's in code
# (SUSHI_V3_QUOTER = "" turns venue 1 off). Gasless makers' ERC-2612 permits ride in
# executeFill (PERMIT_FILLS_ENABLED, default on).
# Pool routing (2026-10-12): the pools between ROUTE_TOKENS and the hubs (WRBTC, USDT0,
# RIF, DOC) are DISCOVERED on both venues (getPool + CREATE2 check + liquidity/slot0,
# ~2 Multicall3 eth_calls, refreshed hourly and kept in the DO state) and routed
# multi-hop / mixed-venue — at most ROUTE_MAX_CANDIDATES quoted per fill, batched
# through Multicall3 (≤ 1 eth_call per hop round). All defaults live in code; see
# "Pool routing" in packages/beta-filler/README.md.
ROUTE_DISCOVERY = "1"
# Discover from the venues' indexers (Oku API + Sushi v3 subgraph, 2026-10-14): TVL-
# filtered (ROUTE_MIN_TVL_USD), every pool CREATE2-verified, zero RPC; the RPC probe is
# the fallback when an indexer fails. `GET /pools` (admin) shows the graph with TVL.
ROUTE_DISCOVERY_SOURCE = "indexers"
ROUTE_MIN_TVL_USD = "1000"
ROUTE_MAX_HOPS = "3"
ROUTE_MAX_CANDIDATES = "5"
# Pull-order API route sources (exact-input only; direct orders always use a pool plan).
# Each response is fully decoded and validated against the fill (beta-filler README).
SUSHI_ENABLED = "1"
ROUTE_OKU_PULL = "1"
# Pinned snwap executor (Sushi's RouteProcessor on Rootstock, re-checked 2026-10-11):
# any other executor is refused. "" would UNPIN it (warned at start-up).
SUSHI_EXECUTORS = "0xC10eE9031F2a0B84766A86B55a8D90F357910fb4"
SUSHI_MAX_PER_SWEEP = "10"
SUSHI_TIMEOUT_MS = "4000"
# Nordstern aggregator (2026-10-11; off by default in code, on for the beta). The guard
# (NORDSTERN_ROUTER) defaults to Rootstock's 0x63d3…527c; the executor pin is STRICT
# (empty = every route refused). Priced at toAmount × (1 − NORDSTERN_HAIRCUT_BPS): the
# API's figure ran ~1 bp above what a fork execution delivered. The API refuses
# requests without a Referer naming the integrating project's domain.
NORDSTERN_ENABLED = "1"
NORDSTERN_EXECUTORS = "0xb4FE60CD05A3e68668007Cee83DDFD9A50A45B36"
NORDSTERN_REFERER = "https://1delta-x.pages.dev"
NORDSTERN_HAIRCUT_BPS = "2"
NORDSTERN_MAX_PER_SWEEP = "10"
NORDSTERN_TIMEOUT_MS = "3000"
BUY_USDRIF = "1"
SELL_USDRIF = "0"
MAX_BUY_PRICE = "0.995"
MIN_EXIT_EDGE_BPS = "30"
MIN_SELL_PRICE = "1.003"
MAX_FILL_USDT0 = "500"
MIN_FILL_USDT0 = "5"
# Inventory all-in gas gate: a fill must earn its own gas (estimate × the learned receipt ratio),
# its pro-rata share of the rebalance it causes, and this minimum profit.
INVENTORY_GAS_ESTIMATE = "260000"
REBALANCE_GAS = "450000"
INVENTORY_MIN_PROFIT_USDT0 = "0.02"
# RBTC_PRICE_USD = "85000"   # optional floor for gas pricing; the higher of it and the WRBTC/USDT0 pool is used
HOURLY_USDT0 = "2000"
HOURLY_USDRIF = "2000"
USDRIF_RESERVE = "0"
REDEEM_MIN_USDRIF = "1000"   # batch size: one redeem+sell (~450k gas ≈ $1) per 1000 USDRIF
REDEEM_SLIPPAGE_BPS = "50"
# 2026-10-14: the RIF in the wallet is now INVENTORY for the RIF rail — never auto-sold.
# (200 sold any RIF ≥ 200; a huge threshold keeps the old redeem→sell exit off.)
RIF_SELL_MIN = "1000000000"
RIF_SELL_SLIPPAGE_BPS = "50"
RIF_SELL_MAX_DISCOUNT_BPS = "150"
# THE RIF RAIL (2026-10-14): the wallet makes a two-sided RIF market against USD₮0 (pull orders).
#  • SELL_RIF: makers buy RIF — delivered from the wallet, priced at its MoC replacement cost
#    (USD₮0 → USDRIF on the 0.05 % pool → redeemTP, fee + haircut);
#  • BUY_RIF: makers sell RIF — we pay USD₮0 and keep it, at its replacement cost while RIF is
#    below the target share, at its MoC exit (mintTP → USDRIF → pool) above.
# THE BAND: RIF is volatile, so it is a MINORITY of the wallet's value (USD₮0 + USDRIF + RIF at
# the oracle): below LOW the rebalancer buys back to TARGET, above HIGH it sells down to TARGET,
# and buys that would cross HIGH are refused. USDT0_RESERVE is never spent by the rail.
# Admin: `scripts/admin.sh rebalance-rif` moves it to TARGET now.
SELL_RIF = "1"
BUY_RIF = "1"
RIF_SHARE_LOW_BPS = "1500"
RIF_SHARE_TARGET_BPS = "2000"
RIF_SHARE_HIGH_BPS = "2500"
HOURLY_RIF = "10000"
RIF_RAIL_HAIRCUT_BPS = "20"
USDT0_RESERVE = "100"
RAIL_SWAP_SLIPPAGE_BPS = "30"
USDRIF_PEG_TOLERANCE_BPS = "50"

# ── gas policy (shared by both strategies and the rebalancer) ───────────────
HOURLY_GAS_RBTC = "0.002"
MAX_GAS_PRICE_GWEI = "0.1"
RECEIPT_TIMEOUT_MS = "120000"
# Every tx is sent (and every fill priced) at ⌈latest block minimumGasPrice × this /
# 10000⌉ — eth_gasPrice (= min × 1.1 on rskj) only when the block has no such field.
# The minimum moves ≤ ±1 %/block (RSKIP-09): +3 % stays includable through two
# consecutive maximal rises after the block read (+2 % through one). 10000..20000.
# The app's floor uses the same multiplier (pinned by APP-FLOOR-2).
GAS_PRICE_MIN_MULT_BPS = "10300"
# Fills are PRICED at eth_estimateGas × r, r = max(receipt / estimate) over the last 20
# receipts of the fill's shape, clamped to [0.6, 1.0]; this is r before any receipt
# (e2e on a fresh solver: 0.845–0.877). The gas LIMIT keeps estimate × 1.25.
DEFAULT_GAS_RECEIPT_RATIO = "0.88"

# ── indicative quotes: PUBLIC `POST /quote` (packages/beta-filler src/quote.ts) ─
# amountOut = route (or inventory) output − one fill's gas × (1 + QUOTE_GAS_MARGIN_BPS),
# gas priced as the fill gate prices it (estimate × the learned receipt ratio × the
# send price). The app signs a Dutch order starting AT the quote and decaying over 210 s. Reached by the
# app's Pages worker over a FILLER service binding (`/api/quote`); the secret
# QUOTE_BINDING_KEY lets it name the visitor's IP for the per-IP limit.
QUOTE_ENABLED = "1"
# 3 % (was 10 %): r is now the max of each shape's last 5 receipts and the estimate the
# shape's own (permit / plain), so the priced gas tracks the receipt closely — a USD0 →
# USDRIF gasless fill charged 0.79 against 0.66 of real gas (2026-10-12).
QUOTE_GAS_MARGIN_BPS = "300"
QUOTE_TOLERANCE_BPS = "0"
QUOTE_TTL_SECONDS = "30"
# An order first seen up to this long after its quote's validUntil is still matched to
# it (gated without the route haircut — the quote's gas margin is the cushion).
QUOTE_MATCH_GRACE_SECONDS = "120"
# eth_estimateGas assumed per fill before one is learned for the shape (then: the max
# learned). × the 0.88 default receipt ratio ≈ the production e2e receipts (2026-10-07:
# 318k–343k direct, 324k pull); was 400k / 420k, which over-priced a fresh filler's
# small-ticket quotes by ~1 %.
# These are eth_estimateGas units (the fill gate prices simulate × r), NOT receipts:
# 265k / 290k (2026-10-12, from post-refund fork receipts) under-quoted the first v2
# fill — Rootstock simulated a permit-funded pull at 424k on the unseeded solver, so
# the gate needed 373k priced against the quote's 308k and the order expired. The
# learned per-shape max replaces these after the first fill.
# 2026-10-12 (later): the v2 fills' own estimates — direct ~280k, pull ~304k once the
# solver's balances are seeded (retain mode keeps them) — so 300k / 320k. A pair's
# heavier first fill (one-time SSTOREs) is covered by the gas-aware slippage band, and
# the learned max of its last 5 fills replaces these.
QUOTE_GAS_ESTIMATE_DIRECT = "300000"
QUOTE_GAS_ESTIMATE_PULL = "320000"
QUOTE_CACHE_MS = "5000"
# Token buckets (DO SQLite): per visitor IP, and for everyone together (RPC cost bound).
QUOTE_RATE_IP_CAPACITY = "30"
QUOTE_RATE_IP_REFILL = "0.5"
QUOTE_RATE_GLOBAL_CAPACITY = "300"
QUOTE_RATE_GLOBAL_REFILL = "5"

# ── tick loop and per-tick bounds ───────────────────────────────────────────
# Keep TICK_SECONDS ≤ 8: a Durable Object idle for ~10 s is evicted from memory, and
# every tick after an eviction rebuilds the engine (config, state load, the route
# strategy's 6-call solver check) and loses its in-memory caches (resting verdicts,
# the gas price).
TICK_SECONDS = "5"
# While a tx is outstanding: one receipt read per PENDING_TICK_SECONDS. Rootstock
# blocks come every ~30 s, so 1 s polled ~30 times per fill for nothing; 3 s
# notices a receipt within ~10% of a block.
PENDING_TICK_SECONDS = "3"
# Orders evaluated per tick (never-seen orders first, then round-robin; the cursor is
# kept in the DO).
MAX_ORDERS_PER_TICK = "10"
# An order every strategy passed on (unprofitable, out of price, below minimum) — or
# one we just filled — is not re-quoted for this long unless the book reports a
# different fillable for it (a resting book used to cost ~67 RPC calls per tick).
# 60 s (was 300) — the limit-order "cron": a resting limit is re-quoted every ~2 Rootstock
# blocks, so a market that reaches it is caught within a minute, not five. Cost: one
# quote (≈ 2–4 batched RPC calls) per resting order per minute.
RESTING_RECHECK_SECONDS = "60"
# Orders expiring within this many seconds are skipped: a tx cannot land in time on
# ~30 s blocks (the orderbook refuses TTLs under 120 s).
EXPIRY_MARGIN_SECONDS = "90"
# Subrequests (RPC calls + the book fetch) per tick. Workers Paid allows 10,000
# subrequests per invocation by default (Free: 50) —
# https://developers.cloudflare.com/workers/platform/limits/ — this bound is about
# RPC cost and tick length, not the platform limit. A new order is only started while
# at least SUBREQUESTS_PER_ORDER remain.
MAX_SUBREQUESTS_PER_TICK = "500"
SUBREQUESTS_PER_ORDER = "40"
# Wall-clock budget per tick; no new order is started after it.
TICK_BUDGET_MS = "20000"
# 2 × 500 = 1000 orders: the orderbook's MAX_ORDERS (keep them in step).
INTAKE_MAX_PAGES = "2"
INTAKE_PAGE_SIZE = "500"
BALANCE_CHECK_SECONDS = "300"
# The rebalancer step (redeem USDRIF / sell RIF; inventory only) runs at most this often.
REBALANCE_SECONDS = "30"
MAX_FILL_ROWS = "20000"
# The monitor reads the orderbook's /health this often over the ORDERBOOK binding (60 s
# after an inconclusive read: unreachable, or the book's alarm has not run yet) and
# alerts on a stale alarm loop (last alarm > 3 × its interval) or a failing log scan
# (above all an RPC that does not serve eth_getLogs).
BOOK_HEALTH_SECONDS = "300"

# ── alerts (ALERT_WEBHOOK_URL is a secret) ──────────────────────────────────
ALERT_FORMAT = "slack"          # slack | telegram
ALERT_TELEGRAM_CHAT_ID = ""
ALERT_NAME = "filler-1delta-rsk"
ALERT_MIN_RBTC = "0.001"
ALERT_MIN_USDT0 = "50"
ALERT_MIN_USDRIF = "0"
ALERT_REVERTS_PER_HOUR = "3"
# Also the threshold for "sends refused: untracked tx(s) in flight" (pending nonce > mined).
ALERT_PENDING_TX_SECONDS = "600"
ALERT_MOC_PENDING_SECONDS = "900"
ALERT_RPC_ERROR_STREAK = "5"
ALERT_COOLDOWN_SECONDS = "3600"
ALERT_MAX_PER_HOUR = "12"
