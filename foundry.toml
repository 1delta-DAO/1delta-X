# Single root Foundry config spanning the whole monorepo. All packages under
# packages/* are compiled together; cross-package Solidity imports resolve via
# the remappings in remappings.txt (@core/, @coretest/).
[profile.default]
src = "packages"
test = "packages"
script = "packages"
out = "out"
libs = ["lib"]
solc = "0.8.28"
# Pinned so compiled bytecode + measured gas are identical across environments
# (local vs CI) — required for the committed `.gas-snapshot` baseline / `make
# gas-check` to be deterministic. This is already forge's current default; change
# it only alongside a `make gas` baseline regeneration.
evm_version = "prague"
optimizer = true
# MEASURED 2026-08-09. `optimizer_runs` is a hint about how often the deployed code
# is expected to be CALLED, i.e. how much bytecode SIZE to spend on runtime speed —
# not a quality dial. The binding constraint is `Settlement` under via-IR
# (`[profile.core-deploy]`), which must stay under EIP-170's 24,576 bytes:
#
#     runs      Settlement runtime      free
#     200            20,586            3,990
#     20,000         23,103            1,473     ← here
#     25,000         24,325              251
#     30,000+        24,604              −28     FAIL
#
# Above 30,000 the output is byte-identical however high you go (2^32−1 included) —
# it is a step function, so there is no finer dial up there, only a cliff.
#
# 20,000 captures effectively the whole gain and keeps ~1.4KB of headroom: measured
# −1.1% on a plain fill (`test_plain_swap_full` 509,689 → 504,032), −1.2..1.4% on
# multi-leg / batch / netted paths, 364 of 409 tests cheaper, median −1,938. The 45
# tests that got DEARER all deploy a mock contract mid-test (1271 wallets,
# reentrancy attackers, token harnesses) — bigger mocks cost more to CREATE; none is
# a settlement-path regression.
#
# 25,000 buys a sliver more for another 1.2KB and leaves 251 bytes, which is less
# than one small function — one PR from an unshippable contract. Don't.
#
# This lives in [profile.default], so it moves EVERY package's bytecode and gas, not
# just core. Changing it requires a `make gas` baseline regeneration and costs ~2.5KB
# more initcode (~500k gas) at deploy, once.
optimizer_runs = 20000

[profile.default.fuzz]
runs = 256

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false

# ── Per-package profiles ──────────────────────────────────────────────────────
#
# Scope compilation to a single package + its @core/ transitive imports.
# Unrelated packages are never touched, so RAM usage stays bounded.
#
# Usage:
#   FOUNDRY_PROFILE=modules-aave-v3 forge test -vv
#   make test-modules-aave-v3
#   make test-all          # all packages sequentially
#
# Each profile inherits solc / optimizer / libs / remappings from [default].

[profile.core]
src    = "packages/core/src"
test   = "packages/core/test"
script = "packages/core/script"
out    = "out/core"

# DEPLOYMENT profile for the core package: identical settings + via-IR, which
# compiles Settlement ~20% smaller (legacy codegen puts it over EIP-170; via-IR
# fits at 23,103 / 24,576 at the current `optimizer_runs` — ~1.4KB of margin as of
# 2026-08-09, measured by `make size-check`, which is the only figure to trust here;
# see the `optimizer_runs` note above for the size/gas curve). Kept OUT of the dev/test
# profile because via-IR compiles are minutes, not seconds; tests/gas run on
# [profile.core] (same semantics, gas slightly conservative vs. production).
# Deploy scripts and the size gate MUST use this profile.
#
# `test` deliberately points AWAY from packages/core/test: the test tree holds
# non-*.t.sol data contracts (LenderRegistry — ~900KB of initcode) that via-IR
# spends the better part of an hour optimizing. Nothing in this profile ever
# runs tests; it exists to produce deployable artifacts.
# This profile also produces the DEPLOYED artifacts for the periphery —
# SettlementLens and the 7683 settlers — not just Settlement. MEASURED 2026-08-20:
# the lens under legacy codegen at runs=20,000 sat at 24,414/24,576 (162 bytes of
# headroom — TIGHTER than Settlement, making the lens the binding constraint on
# every OrderGates/preview feature); under this profile it is 17,732 (6.8KB free).
# The lens is a view contract whose callers are eth_calls, so runs=400's runtime
# gas costs nobody anything — the ONE paid consumer is DestinationSettler7683's
# previewFill staticcall, an edge adapter; re-measure that call before tuning
# `runs` for it (the size curve is non-monotonic, see below). `make size-check`
# gates all four contracts from this profile.
[profile.core-deploy]
src    = "packages/core/src"
test   = "packages/core/script"
script = "packages/core/script"
out    = "out/core-deploy"
via_ir = true
# ── DETERMINISM PINS ─────────────────────────────────────────────────────────
# This profile produces the DEPLOYED artifact, and a CREATE2 address is a hash of
# init code, so every setting below is part of the address. See
# docs/deterministic-deployment.md §3. Changing any of them starts a NEW ADDRESS
# FAMILY — that is a migration, not a patch.
#
# `bytecode_hash`/`cbor_metadata`: solc appends a CBOR trailer that hashes the
# compiler settings AND the source (comment text included). Left at the defaults
# (`ipfs`/`true`) every doc edit silently moves every address on every chain.
# Stripping the trailer is what makes the address depend on CODE rather than on
# the file it was compiled from.
bytecode_hash  = "none"
cbor_metadata  = false
# Pinned EXPLICITLY rather than inherited. `[profile.default]` says `prague`,
# which is byte-identical here on solc 0.8.28 (§3: prague adds no opcode solc
# emits, and 0.8.28 emits no CLZ at osaka), so this costs nothing today. It is
# pinned because the hazard is a SOLC BUMP: without it the compiler's default
# fork moves with the version, a newer solc emits CLZ at osaka, and that both
# moves every address and fails outright on the 18 surveyed chains lacking it.
# `cancun` is the documented target family — 38 deployable chains (§4.1).
evm_version    = "cancun"
# MEASURED 2026-08-12, and the ONLY place `optimizer_runs` deviates from the
# 20,000 in [profile.default] — deliberately, because this profile produces the
# DEPLOYED artifact and nothing else. [profile.default] still governs every other
# package and the whole committed gas baseline.
#
# The 2026-08 pricing/signing features (block clock, priority auction, external
# price modules, Merkle bulk signatures) put Settlement over EIP-170 at 20,000.
# Figures below are `make size-check`, which is the only measurement to trust:
#
# RE-MEASURED 2026-08-23. The 2026-08-12 table below it is kept for the shape
# lesson, but its CONCLUSIONS no longer hold — the contract has grown ~290 bytes
# since, and the curve moved with it:
#
#     runs      Settlement runtime      free
#     1              24,293               283   smallest available
#     50             24,308               268
#     100            24,308               268
#     200            24,383               193
#     400            24,476               100   ← here
#     800            24,588               −12   FAIL
#     1,600          26,051            −1,475   FAIL
#     3,200          26,592            −2,016   FAIL
#
# Two things that were true in August and are NOT true now:
#   • "the curve is flat below 400, nothing to gain by going lower" — WRONG today.
#     `runs = 1` buys 183 bytes over 400. The old table's 7-byte gap between 200
#     and 400 has widened to 93.
#   • "800 → 245 bytes free" — 800 now FAILS by 12 bytes. The usable range has
#     collapsed to ≤ 400, and 400 itself leaves 100 bytes, not the ~390 the old
#     table records.
#
# ⚠ THE CURVE IS NOT MONOTONIC, in either direction. The pristine pre-feature
# source measured 24,172 at 20,000 but 26,149 at 6,000: `runs` moves inlining
# decisions in steps, so a size change must be MEASURED, never predicted. Do not
# reason about this dial from the [profile.default] table above — that one was
# measured on a smaller contract and its shape does not carry over. The 2026-08-23
# sweep is monotonic across 1..3,200, which is itself a change from August and no
# guarantee for the next source revision.
#
# ⚠ AND DROPPING `runs` IS NOT FREE HEADROOM. The price is runtime gas on the
# DEPLOYED contract, on every fill, forever — and the committed gas baseline
# CANNOT SEE IT, because `make gas` runs on [profile.core] at 20,000. Buying
# bytecode here is buying it with production gas that CI will report as unchanged.
# Prefer moving cold code out of the hot contract (the pricing modes moved out of
# `bumpBps` for 1,343 bytes) over turning this dial down.
#
# 400 is kept: it is the largest value that still fits, so it is the least
# gas-costly setting available. See docs/lop-parity-plan.md §7.
optimizer_runs = 400

# ── Periphery, validators and shared libs, split out of core 2026-08-24 ──────
#
# Same criterion that emptied `core/src/modules`: NOTHING in `packages/core/src`
# imports any of these. The dependency runs one way — periphery → settlement, never
# back — so a bug in any of them costs one integration, not the protocol.
#
#   periphery/    the lens, the ERC-7683 settlers, the native handlers. Deployed
#                 adapters and readers. `SettlementLens` is in the canonical
#                 `Deploy.s.sol` set and is size-gated; see `[profile.periphery-deploy]`.
#   validators/   staticcalled from a maker-signed order, exactly like a module.
#                 One instance per configuration, permissionless to deploy.
#   lib/          shared Solidity libraries for MODULE authors (DustHandler,
#                 FullFillGuard, PermitHelper, DelegationHelper) — 24 module packages
#                 import them and `packages/core/src` imports none of them.
#
# Core keeps only what `settlement/` actually reaches for: `interfaces/`, `permit3/`,
# and the two libs in `utils/` (SafeTransferLib, Permit3TransferLib).

[profile.periphery]
src    = "packages/periphery/src"
test   = "packages/periphery/test"
script = "packages/periphery/script"
out    = "out/periphery"

[profile.validators]
src    = "packages/validators/src"
test   = "packages/validators/test"
script = "packages/validators/script"
out    = "out/validators"

[profile.lib]
src    = "packages/lib/src"
test   = "packages/lib/test"
script = "packages/lib/script"
out    = "out/lib"

# DEPLOYMENT profile for the periphery, and the reason it exists: `SettlementLens` is
# deployed through the same CREATE2 factory as Settlement (`Deploy.s.sol` deploys
# permit3 → settlement → lens), so its ADDRESS is a hash of its init code and every
# setting below is part of that address.
#
# ⚠ These MUST stay byte-identical to `[profile.core-deploy]`. They were copied from
# it verbatim when the periphery moved out of core, and the lens's init-code hash was
# verified UNCHANGED across the move. Changing one of them here without changing it
# there — or vice versa — starts a new address family for the lens alone, silently.
# See docs/deterministic-deployment.md §3.
[profile.periphery-deploy]
src    = "packages/periphery/src"
test   = "packages/periphery/src"
script = "packages/periphery/src"
out    = "out/periphery-deploy"
via_ir = true
bytecode_hash  = "none"
cbor_metadata  = false
evm_version    = "cancun"
optimizer_runs = 400

[profile.solvers]
src    = "packages/solvers/src"
test   = "packages/solvers/test"
script = "packages/solvers/script"
out    = "out/solvers"

