# via-IR: the Across `depositV3` entrypoint takes twelve arguments, which the
# legacy codegen cannot lay out without blowing the stack. The package is small
# (a handful of leaf contracts, no Settlement), so the compile stays in seconds
# rather than the minutes `core-deploy` costs.
[profile.modules-bridge]
via_ir = true
src    = "packages/modules/bridge/src"
test   = "packages/modules/bridge/test"
script = "packages/modules/bridge/script"
out    = "out/modules-bridge"

# ── Modules relocated out of core, 2026-08-24 ─────────────────────────────────
#
# `packages/core/src/modules` is GONE. Every module now lives here, grouped by the
# core interface it implements: pricing/* = IPriceModule, fill/ = IFillModule,
# nft/ = ISettlementModule, maker/ = IMakerModule, oco/ = both (stateful).
#
# Nothing in `packages/core/src` ever imported one — a module is reached only through
# a maker-signed `pricingModule` / `fillModule` / item `module` field — so none of
# them was ever part of the baseline, and Settlement is untouched by the move.
#
# Core still proves its SIDE of each seam, on local mocks in
# `packages/core/test/shared/MockModules.sol`. That is deliberate: testing the core
# against a shipped product measures two things at once, and a mock that can be told
# what to answer makes a failure point at the core.

[profile.modules-pricing-chainlink]
src    = "packages/modules/pricing/chainlink/src"
test   = "packages/modules/pricing/chainlink/test"
script = "packages/modules/pricing/chainlink/script"
out    = "out/modules-pricing-chainlink"

